version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Agrupa init+analyze do CodeQL no mesmo PR: bumps separados deixam as duas
    # versões diferentes no workflow e o check 'CodeQL Security Analysis' falha.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
